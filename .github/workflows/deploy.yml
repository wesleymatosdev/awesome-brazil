name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx awesome-lint

  deploy:
    needs: lint
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Renderizar README como página
        run: |
          npm install --no-audit --no-fund marked github-markdown-css
          node --input-type=module -e "
          import { readFileSync, writeFileSync, mkdirSync, copyFileSync } from 'node:fs';
          import { Marked } from 'marked';
          const md = readFileSync('README.md', 'utf8');
          const marked = new Marked({ gfm: true });
          // Resolve links relativos ao repo (LICENSE, CONTRIBUTING.md, CODE_OF_CONDUCT.md)
          const html = marked.parse(md)
            .replace(/href=\"(CONTRIBUTING\.md|CODE_OF_CONDUCT\.md|LICENSE)\"/g,
                     'href=\"https://github.com/wesleymatosdev/awesome-iniciativas/blob/main/\$1\"');
          const css = readFileSync('node_modules/github-markdown-css/github-markdown-light.css', 'utf8');
          const page = '<!DOCTYPE html>
          <html lang=\"pt-BR\">
          <head>
            <meta charset=\"UTF-8\">
            <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">
            <title>Awesome Iniciativas — iniciativas brasileiras de tecnologia aberta</title>
            <meta name=\"description\" content=\"Lista curada de iniciativas brasileiras de tecnologia aberta: dados abertos, civic tech, comunidades e ferramentas.\">
            <style>' + css + '</style>
            <style>
              .markdown-body { box-sizing: border-box; min-width: 200px; max-width: 880px; margin: 0 auto; padding: 45px; }
              @media (max-width: 767px) { .markdown-body { padding: 15px; } }
            </style>
          </head>
          <body>
            <article class=\"markdown-body\">" + html + "</article>
          </body>
          </html>';
          mkdirSync('_site');
          writeFileSync('_site/index.html', page);
          copyFileSync('README.md', '_site/README.md');
          console.log('página gerada');
          "

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - id: deployment
        uses: actions/deploy-pages@v4
