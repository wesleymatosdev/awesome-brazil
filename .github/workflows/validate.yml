name: Validar dados do hub

on:
  pull_request:
    paths:
      - "data/**"
  push:
    branches: [main]
    paths:
      - "data/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências de validação
        run: npm install --no-save ajv ajv-formats

      - name: Validar apps.json contra o schema
        run: node scripts/validate.mjs
